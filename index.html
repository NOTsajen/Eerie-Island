<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-capable" content="yes" /><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" /><meta name="theme-color" content="#0b0f1a" /><link rel="manifest" href="/manifest.webmanifest" />
<title>Island Echoes: Survival & Betrayal</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;font-family:'Courier New',monospace;color:#3b2a1a;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;height:100dvh}canvas{image-rendering:pixelated}
.panel{background:#f6e6b4ee;border:3px solid #5a3a1e;box-shadow:0 3px 0 #0007;border-radius:4px}
/* top-left clock */
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);left:6px;width:132px;padding:5px 6px;font-size:9px;z-index:5;text-align:center;background:#f6e6b4ee;border:3px solid #5a3a1e;box-shadow:0 3px 0 #0007;border-radius:4px}
#clock{font-weight:bold;color:#5a2a10;font-size:11px;line-height:1.35}#clock small{display:block;font-size:8px;opacity:.85}
#gear{display:flex;justify-content:center;flex-wrap:wrap;font-size:9px}#gear:empty{display:none}
/* top-right stat bars */
#vbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:6px;width:128px;display:flex;flex-direction:column;gap:4px;padding:6px;z-index:5;background:#f6e6b4ee;border:3px solid #5a3a1e;box-shadow:0 3px 0 #0007;border-radius:4px}
.vs{display:flex;align-items:center;gap:5px}
.vs img{width:16px;height:16px;image-rendering:pixelated;flex:none}
.vt{position:relative;flex:1;height:10px;background:#3a2214;border:2px solid #1d1009;display:flex;align-items:stretch}
.vt b{display:block;height:100%;width:100%;transition:width .15s}
.vt:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to right,transparent 0 6px,#0005 6px 7px);pointer-events:none}
.vs.low .vt{animation:blink .6s steps(2) infinite}
@keyframes blink{50%{border-color:#ff3a3a}}
.bar{display:flex;align-items:center;gap:6px;margin:3px 0}.bar span{width:30px;font-weight:bold}.bar i{flex:1;height:8px;background:#6b4423;border:1px solid #3b2a1a}.bar b{display:block;height:100%;width:100%;transition:width .15s}
/* left vertical inventory */
#inv{position:fixed;left:6px;top:calc(env(safe-area-inset-top,0px) + 92px);display:flex;flex-direction:column;flex-wrap:nowrap;align-items:center;gap:3px;padding:4px;background:#b07a3aee;border:3px solid #3a2210;box-shadow:0 3px 0 #0007;border-radius:4px;z-index:5}
#inv:empty{display:none}
#inv .chip{flex-direction:column;position:relative;width:40px;height:40px;margin:0;justify-content:center;background:#e8c88a;border:2px solid #5a3a1e;box-shadow:inset 0 0 0 2px #f6e2b0;font-size:8px;font-weight:bold;color:#3a2210;text-align:center;overflow:hidden;line-height:1}
#inv .chip img{width:24px;height:24px}#inv br{display:none}
#inv .kn{position:absolute;top:1px;left:3px;font-size:7px;font-style:normal;color:#7a4a22}
#inv .slot{cursor:pointer}#inv .slot.sel{border-color:#ffd24a;box-shadow:inset 0 0 0 2px #fff2a0,0 0 0 2px #ffd24a}
#inv .more{color:#fff2a0;font-size:8px;font-weight:bold}
.chip{display:inline-flex;align-items:center;gap:2px;margin:1px 4px 1px 0}.chip img{width:20px;height:20px;image-rendering:pixelated}
/* bottom dialogue panel */
#dlg{position:fixed;left:6px;right:6px;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);height:96px;z-index:6;display:flex;flex-direction:column;padding:6px 8px;background:#1a110add;border:3px solid #c9953a;border-radius:4px;box-shadow:0 3px 0 #0009;font-size:11px;color:#f6e6b4}
#toast{position:static;transform:none;background:none;border:0;box-shadow:none;padding:0 0 3px;opacity:.6;transition:opacity .2s;font-size:12px;font-weight:bold;color:#ffd24a;min-height:16px;z-index:auto}
#toast.show{opacity:1}
#chat{position:static;width:auto;flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;font-size:11px}
#log{color:#fff;text-shadow:1px 1px 0 #000;overflow:hidden;line-height:1.25}
#msg{display:none;width:100%;font:inherit;background:#e8d3a2;border:2px solid #6b4423;margin-top:2px}
#room{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px + 118px);right:6px;z-index:5;font-size:10px;background:#e8d3a2;border:3px solid #6b4423;padding:4px 6px;border-radius:4px}
#modal{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:9}#modal.show{display:grid}
.card{background:#e8d3a2;border:4px solid #6b4423;box-shadow:6px 6px 0 #000;padding:16px 18px;text-align:center;animation:pop .25s;max-width:94vw;max-height:92dvh;overflow:auto}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
.card.npc{width:310px;max-width:94vw;text-align:left}
.card button{font:inherit;background:#c9a96a;border:2px solid #6b4423;margin:2px;padding:3px 6px;cursor:pointer;box-shadow:2px 2px 0 #000a}
.card .story{font-size:11px;margin:4px 0}.card input,.card select{font:inherit}
#help{display:none}
/* touch controls: joystick + one ACT + one menu */
#touch{position:fixed;inset:0;pointer-events:none;z-index:4}#touch>*{pointer-events:auto}
#joy{position:absolute;left:64px;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);width:104px;height:104px;border-radius:50%;background:#e8d3a244;border:3px solid #6b4423aa;touch-action:none}
#knob{position:absolute;left:32px;top:32px;width:40px;height:40px;border-radius:50%;background:#e8d3a2cc;border:3px solid #6b4423}
#tact{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 126px);display:flex;flex-direction:column;align-items:center;gap:8px}
#tact button{font:bold 12px monospace;border:3px solid #6b4423;background:#e8d3a2ee;box-shadow:0 3px 0 #0008;touch-action:none;border-radius:50%}
#tact .act{width:74px;height:74px;font-size:15px}#tact .mnu{width:44px;height:44px;font-size:18px;line-height:1}
#tpal{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 290px);width:min(230px,70vw);display:none;flex-wrap:wrap;gap:5px;justify-content:flex-end;padding:8px;background:#1a110aee;border:3px solid #c9953a;border-radius:6px}
#tpal button{font:bold 11px monospace;background:#e8d3a2;border:2px solid #6b4423;padding:8px 6px;min-width:62px;border-radius:3px;touch-action:none}
#rot{display:none;position:fixed;inset:0;z-index:99;background:#0b0f1a;color:#f6e6b4;place-items:center;text-align:center;font-size:16px}
@media (orientation:landscape) and (pointer:coarse){#rot{display:grid}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"></div><div id="vbar"></div><div id="room"></div>
<div id="dlg"><div id="toast"></div><div id="chat"><div id="log"></div><input id="msg" maxlength="120" placeholder="Enter to send, /l = local"></div></div>
<div id="modal"></div>
<div id="help"></div>
<div id="rot">&#8635;<br>Rotate your phone<br>to portrait</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
