<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Island Echoes: Survival & Betrayal</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;font-family:'Courier New',monospace;color:#3b2a1a}
#game{position:fixed;inset:0}canvas{image-rendering:pixelated}
#hud{position:fixed;top:10px;right:10px;min-width:130px;max-width:200px;padding:8px 10px;background:linear-gradient(#f6e6b4,#e8d3a2);border:4px solid #5a3a1e;outline:3px solid #c9953a;box-shadow:0 0 0 7px #2a1a0e,5px 7px 0 7px #0008;font-size:11px;z-index:5;text-align:right}
#vbar{position:fixed;left:14px;top:50%;transform:translateY(-62%);display:flex;flex-direction:column;gap:7px;padding:8px 6px;background:linear-gradient(#f6e6b4,#e8d3a2);border:4px solid #5a3a1e;outline:3px solid #c9953a;box-shadow:0 0 0 7px #2a1a0e,5px 7px 0 7px #0008;z-index:5}
.vs{display:flex;flex-direction:column;align-items:center;gap:3px}
.vs img{width:20px;height:20px;image-rendering:pixelated}
.vt{position:relative;width:16px;height:46px;background:#3a2214;border:2px solid #1d1009;display:flex;align-items:flex-end;box-shadow:inset 0 0 0 1px #8a5a2b}
.vt b{display:block;width:100%;height:100%;transition:height .15s;image-rendering:pixelated}
.vt:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 4px,#0006 4px 5px);pointer-events:none}
.vs.low .vt{animation:blink .6s steps(2) infinite}
@keyframes blink{50%{border-color:#ff3a3a}}
@media (max-height:520px){.vt{height:30px}.vs img{width:16px;height:16px}}
.bar{display:flex;align-items:center;gap:6px;margin:3px 0}
.bar span{width:30px;font-weight:bold}
.bar i{flex:1;height:8px;background:#6b4423;border:1px solid #3b2a1a}
.bar b{display:block;height:100%;width:100%;transition:width .15s}
#clock{font-weight:bold;color:#5a2a10;text-shadow:1px 1px 0 #fff8;font-size:13px;line-height:1.5;text-align:center}#clock small{display:block;font-size:10px;opacity:.8}
#inv{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);max-width:94vw;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;padding:5px;background:linear-gradient(#b07a3a,#8a5a2b);border:4px solid #3a2210;outline:2px solid #d9a85a;box-shadow:4px 5px 0 #0008;z-index:5;min-height:44px}#inv:empty{display:none}#inv .chip{flex-direction:column;position:relative;width:44px;height:44px;margin:0;justify-content:center;background:#e8c88a;border:2px solid #5a3a1e;box-shadow:inset 0 0 0 2px #f6e2b0;font-size:9px;font-weight:bold;color:#3a2210;text-align:center;overflow:hidden;line-height:1}#inv .chip img{width:28px;height:28px}#inv br{display:none}#inv .kn{position:absolute;top:1px;left:3px;font-size:8px;font-style:normal;color:#7a4a22}#inv .slot{cursor:pointer}#inv .slot.sel{border-color:#ffd24a;box-shadow:inset 0 0 0 2px #fff2a0,0 0 0 2px #ffd24a;transform:translateY(-3px)}#inv .more{align-self:center;color:#fff2a0;font-size:10px;font-weight:bold;padding:0 3px}#gear{display:flex;justify-content:center;flex-wrap:wrap;font-size:10px}#toast{bottom:76px!important}
.chip{display:inline-flex;align-items:center;gap:2px;margin:1px 6px 1px 0}.chip img{width:24px;height:24px;image-rendering:pixelated}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) scale(.9);background:#e8d3a2;border:3px solid #6b4423;box-shadow:3px 3px 0 #000a;padding:6px 12px;opacity:0;transition:.2s;z-index:6;font-size:12px}
#toast.show{opacity:1;transform:translateX(-50%) scale(1)}
#modal{position:fixed;inset:0;display:none;place-items:center;background:#000b;z-index:9}
#modal.show{display:grid}
.card{background:#e8d3a2;border:4px solid #6b4423;box-shadow:6px 6px 0 #000;padding:20px 28px;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
#help{position:fixed;bottom:8px;right:10px;color:#e8d3a2aa;font-size:10px;z-index:5}
.card.npc{width:310px;text-align:left}
.card button{font:inherit;background:#c9a96a;border:2px solid #6b4423;margin:2px;padding:3px 6px;cursor:pointer;box-shadow:2px 2px 0 #000a}
.card button:hover{transform:translateY(-1px)}
.card .story{font-size:11px;margin:4px 0}
#chat{position:fixed;left:10px;bottom:10px;width:270px;z-index:5;font-size:11px}
#log{color:#fff;text-shadow:1px 1px 0 #000;margin-bottom:3px}
#msg{display:none;width:100%;font:inherit;background:#e8d3a2;border:2px solid #6b4423}
#room{display:none;position:fixed;top:10px;left:92px;z-index:5;font-size:11px;background:#e8d3a2;border:3px solid #6b4423;padding:6px;box-shadow:4px 4px 0 #000a}
.card input,.card select{font:inherit}
html,body{touch-action:none;user-select:none;-webkit-user-select:none}
#touch{position:fixed;inset:0;pointer-events:none;z-index:4}
#touch>*{pointer-events:auto}
#joy{position:absolute;left:18px;bottom:120px;width:110px;height:110px;border-radius:50%;background:#e8d3a255;border:3px solid #6b4423aa;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:#e8d3a2cc;border:3px solid #6b4423}
#tbtns{position:absolute;right:10px;bottom:10px;width:230px;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
#tbtns button,#tpal button{font:bold 11px monospace;background:#e8d3a2dd;border:2px solid #6b4423;padding:8px 6px;min-width:50px;box-shadow:2px 2px 0 #000a;touch-action:none}
#tbtns .big{width:100%;padding:16px;font-size:14px}
#tpal{position:absolute;right:10px;bottom:260px;width:200px;display:none;flex-wrap:wrap;gap:4px;justify-content:flex-end}
@media (max-width:700px){#hud{min-width:120px;max-width:170px;font-size:9px}#vbar{left:4px;padding:5px 3px}}
@media (pointer:coarse){#help{display:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="vbar"></div><div id="hud"></div>
<div id="toast"></div>
<div id="modal"></div>
<div id="chat"><div id="log"></div><input id="msg" maxlength="120" placeholder="Enter to send, /l = local"></div><div id="room"></div>
<div id="help">WASD · SPACE act · E eat · C fire · T talk · 1-8 build · L lantern · Z/X/V craft · F tower · M room · P ping</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
